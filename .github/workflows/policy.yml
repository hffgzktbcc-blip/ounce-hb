name: Scope policy

# Enforces CONTRIBUTING.md section 1 (rule 6) on new issues, pull requests and discussions.
# pull_request_target runs with write permissions on the base repository, so this workflow
# never checks out or runs code from the pull request. It checks out the default branch only and
# passes untrusted text through environment variables.

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]
  discussion:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  discussions: write

jobs:
  policy:
    if: |
      github.event.repository.private == false &&
      github.event.sender.type != 'Bot' &&
      !endsWith(github.event.sender.login, '[bot]') &&
      github.event.sender.login != github.repository_owner
    name: Scope policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Apply scope policy to the new item
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          EVENT_KIND: ${{ github.event_name == 'issues' && 'issue' || github.event_name == 'pull_request_target' && 'pull_request' || 'discussion' }}
          ITEM_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || github.event.discussion.number }}
          ITEM_NODE_ID: ${{ github.event.discussion.node_id }}
          ITEM_AUTHOR: ${{ github.event.issue.user.login || github.event.pull_request.user.login || github.event.discussion.user.login }}
          ITEM_AUTHOR_TYPE: ${{ github.event.issue.user.type || github.event.pull_request.user.type || github.event.discussion.user.type }}
          ITEM_TITLE: ${{ github.event.issue.title || github.event.pull_request.title || github.event.discussion.title }}
          ITEM_BODY: ${{ github.event.issue.body || github.event.pull_request.body || github.event.discussion.body }}
        run: python3 scripts/triage_policy.py
