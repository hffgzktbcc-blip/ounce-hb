name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      # Note: On Windows runners, git defaults to core.autocrlf=true, which converts repository
      # LF line endings to CRLF on checkout. This breaks `cargo fmt --check` and shell scripts.
      # We explicitly disable autocrlf before checkout so that files retain LF line endings.
      - name: Configure Git line endings
        run: git config --global core.autocrlf false

      # actions/checkout v4; full commit SHA pinned as in ounce-core.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Guardrails (unregistered binaries, key/decryption code)
        run: |
          scripts/guardrails.sh --self-test
          scripts/guardrails.sh

      # Offline tests for the repository automation scripts (triage, claim, welcome). gh is faked.
      - name: Automation script tests
        run: |
          PYTHON=$(command -v python3 || command -v python)
          "$PYTHON" -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install stable --profile minimal -c rustfmt -c clippy
          rustc --version

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --workspace --locked

  artifact-roundtrip:
    name: release artifact compatibility (upload v4 / download v8)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # This synthetic check exercises the proposed release download action without
      # creating a tag, publishing a release, or building/distributing a binary.
      - name: Create synthetic release artifact
        shell: bash
        run: |
          mkdir -p artifact-input
          printf 'ounce-hb artifact compatibility\n' > artifact-input/roundtrip.txt
          (cd artifact-input && sha256sum roundtrip.txt > roundtrip.txt.sha256)

      - name: Upload synthetic release artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-artifact-compatibility
          path: artifact-input/*
          if-no-files-found: error
          retention-days: 1

      - name: Download synthetic release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Verify artifact contents and checksum
        shell: bash
        run: |
          (cd dist && sha256sum --check roundtrip.txt.sha256)
          printf 'ounce-hb artifact compatibility\n' | cmp - dist/roundtrip.txt
