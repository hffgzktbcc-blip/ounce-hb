name: ounce-core-e2e
# Runs the end-to-end tests against the real ounce-core v0.8.0 release binary. Kept separate from
# ci.yml so that a change here cannot touch the main check job.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  OUNCE_CORE_VERSION: v0.8.0

jobs:
  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            asset: ounce-core-linux-x86_64.tar.gz
          - os: macos-latest
            name: macos-arm64
            asset: ounce-core-macos-arm64.tar.gz
    steps:
      # actions/checkout v7.0.1; same pinned SHA as ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download ounce-core and verify its sha256
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          base="https://github.com/hffgzktbcc-blip/ounce-core/releases/download/${OUNCE_CORE_VERSION}"
          dir="$RUNNER_TEMP/ounce-core"
          mkdir -p "$dir"
          cd "$dir"
          curl -sSfL -o SHA256SUMS "$base/SHA256SUMS"
          curl -sSfL -o "$ASSET" "$base/$ASSET"
          expected=$(awk -v f="$ASSET" '$2 == f { print $1 }' SHA256SUMS)
          if [ -z "$expected" ]; then
            echo "SHA256SUMS has no entry for $ASSET" >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$ASSET" | awk '{ print $1 }')
          else
            actual=$(shasum -a 256 "$ASSET" | awk '{ print $1 }')
          fi
          if [ "$actual" != "$expected" ]; then
            echo "sha256 mismatch for $ASSET: expected $expected, got $actual" >&2
            exit 1
          fi
          echo "sha256 verified for $ASSET"
          tar -xzf "$ASSET" ounce-core
          chmod +x ounce-core
          ./ounce-core --version | head -3
          echo "OUNCE_CORE_BIN=$dir/ounce-core" >> "$GITHUB_ENV"
      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install stable --profile minimal -c rustfmt -c clippy
          rustc --version
      - name: End-to-end tests against ounce-core
        run: |
          set -o pipefail
          cargo test --locked --test ounce_core_run --test ounce_core_e2e --test guest_args -- --nocapture 2>&1 | tee e2e.log
          # A skipped test passes silently, so refuse a run where ounce-core was not used.
          if grep -q "SKIPPED" e2e.log; then
            echo "an end-to-end test was skipped; ounce-core was not exercised" >&2
            exit 1
          fi
