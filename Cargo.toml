[package]
name = "ounce-hb"
version = "0.0.1"
edition = "2024"
description = "Runner for Switch homebrew (NRO/NSO built from source with devkitPro/libnx), built on ounce-core"
license = "MIT"
publish = false

[workspace]
members = ["."]

[dependencies]
# Pinned to a commit on ounce-core main. ounce-core currently has no library target, so Cargo
# resolves and locks it but ignores it at build time; see docs/OUNCE_CORE_API_NEEDS.md.
ounce-core = { git = "https://github.com/hffgzktbcc-blip/ounce-core", rev = "f80d2e4700b707e0de5d61637a3433cd51501cd0" }
