name: Setup Ounce Family Tools
description: >
  Install prebuilt ounce-hb and ounce-core (MIT) releases, with optional
  ounce-runtime (GPL-3.0-or-later) installation, and verify with ounce-hb doctor.

inputs:
  install-hb:
    description: >
      Set to 'false' to skip installing ounce-hb (useful when dogfooding a locally
      built ounce-hb binary).
    required: false
    default: 'true'
  ounce-hb-version:
    description: Release tag for ounce-hb (e.g. v0.2.0 or latest)
    required: false
    default: latest
  ounce-core-version:
    description: Release tag for ounce-core (e.g. v0.10.0 or latest)
    required: false
    default: latest
  install-runtime:
    description: >
      Set to 'true' to also install ounce-runtime (licensed under GPL-3.0-or-later,
      kept separate from MIT ounce-hb/ounce-core as an external subprocess binary).
    required: false
    default: 'false'
  ounce-runtime-version:
    description: Release tag for ounce-runtime (e.g. v0.7.0 or latest)
    required: false
    default: latest

outputs:
  bin-dir:
    description: Directory containing installed Ounce binaries (added to PATH)
    value: ${{ steps.install.outputs.bin-dir }}

runs:
  using: composite
  steps:
    - name: Download and install Ounce tools
      id: install
      shell: bash
      env:
        INSTALL_HB: ${{ inputs.install-hb }}
        HB_VER: ${{ inputs.ounce-hb-version }}
        CORE_VER: ${{ inputs.ounce-core-version }}
        INSTALL_RUNTIME: ${{ inputs.install-runtime }}
        RUNTIME_VER: ${{ inputs.ounce-runtime-version }}
      run: |
        set -euo pipefail

        EXE=""
        case "${RUNNER_OS}" in
          Linux)
            case "${RUNNER_ARCH:-X64}" in
              ARM64) TARGET="linux-arm64" ;;
              X64)   TARGET="linux-x86_64" ;;
              *)
                echo "::error::Unsupported Linux RUNNER_ARCH: ${RUNNER_ARCH}"
                exit 1
                ;;
            esac
            EXT="tar.gz"
            ;;
          macOS)
            TARGET="macos-arm64"
            EXT="tar.gz"
            ;;
          Windows)
            TARGET="windows-x86_64"
            EXT="zip"
            EXE=".exe"
            ;;
          *)
            echo "::error::Unsupported RUNNER_OS: ${RUNNER_OS}"
            exit 1
            ;;
        esac

        BIN_DIR="${RUNNER_TEMP}/ounce-bin"
        mkdir -p "${BIN_DIR}"

        download_and_extract() {
          local repo="$1"
          local ver="$2"
          local verify_sha="$3"
          local asset="${repo}-${TARGET}.${EXT}"
          local base_url
          if [ "${ver}" = "latest" ]; then
            base_url="https://github.com/hffgzktbcc-blip/${repo}/releases/latest/download"
          else
            base_url="https://github.com/hffgzktbcc-blip/${repo}/releases/download/${ver}"
          fi

          local tmp_dir
          tmp_dir="$(mktemp -d)"
          echo "Downloading ${base_url}/${asset}..."
          curl -fsSL "${base_url}/${asset}" -o "${tmp_dir}/${asset}"

          if [ "${verify_sha}" = "true" ]; then
            curl -fsSL "${base_url}/${asset}.sha256" -o "${tmp_dir}/${asset}.sha256"
            if command -v sha256sum >/dev/null 2>&1; then
              (cd "${tmp_dir}" && tr -d '\r' < "${asset}.sha256" | sha256sum -c -)
            elif command -v shasum >/dev/null 2>&1; then
              (cd "${tmp_dir}" && tr -d '\r' < "${asset}.sha256" | shasum -a 256 -c -)
            fi
          fi

          if [ "${EXT}" = "tar.gz" ]; then
            tar -xzf "${tmp_dir}/${asset}" -C "${BIN_DIR}"
          elif [ "${RUNNER_OS}" = "Windows" ] && command -v pwsh >/dev/null 2>&1; then
            local zip_win bin_win
            zip_win="$(cygpath -w "${tmp_dir}/${asset}")"
            bin_win="$(cygpath -w "${BIN_DIR}")"
            pwsh -NoProfile -Command "Expand-Archive -LiteralPath '${zip_win}' -DestinationPath '${bin_win}' -Force"
          else
            unzip -qo "${tmp_dir}/${asset}" -d "${BIN_DIR}"
          fi
          rm -rf "${tmp_dir}"
        }

        if [ "${INSTALL_HB}" = "true" ]; then
          download_and_extract "ounce-hb" "${HB_VER}" "true"
        fi
        download_and_extract "ounce-core" "${CORE_VER}" "true"

        if [ "${INSTALL_RUNTIME}" = "true" ]; then
          echo "Installing optional ounce-runtime (GPL-3.0-or-later)..."
          download_and_extract "ounce-runtime" "${RUNTIME_VER}" "true"
        fi

        chmod +x "${BIN_DIR}"/* 2>/dev/null || true
        echo "${BIN_DIR}" >> "${GITHUB_PATH}"
        echo "bin-dir=${BIN_DIR}" >> "${GITHUB_OUTPUT}"

        if [ -x "${BIN_DIR}/ounce-hb${EXE}" ]; then
          "${BIN_DIR}/ounce-hb${EXE}" doctor --json
        elif command -v ounce-hb >/dev/null 2>&1; then
          ounce-hb doctor --json
        else
          echo "Skipping ounce-hb doctor (install-hb=${INSTALL_HB} and ounce-hb not on PATH)."
        fi
