name: Publish wiki

# docs/wiki/ is the source of truth. This copies it to the GitHub wiki after a change lands on main.
# It only runs on pushes to main (never on pull requests), so no untrusted code reaches the token.
on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - 'scripts/publish_wiki.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Publish pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 -I scripts/publish_wiki.py
