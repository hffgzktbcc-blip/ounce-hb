name: Pull Request Labeler

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # The action reads repository config and PR file metadata through GitHub's API.
      # Do not check out or execute code from the pull request in this workflow.
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: false
