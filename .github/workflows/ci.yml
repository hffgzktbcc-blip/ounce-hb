name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides whether the Rust build/lint/test steps are needed. Docs-only changes (Markdown, docs/,
  # LICENSE, issue templates) skip them. Anything else, including workflow edits, runs everything,
  # and so does every push to main. The `check` job below always runs (cheap steps only on
  # docs-only changes) so the required status names `check (<os>)` still report on every PR.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - name: Decide scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename'); then
            echo "Could not list changed files; running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$files"
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -qvE '(\.md$|^docs/|^LICENSE|^\.github/ISSUE_TEMPLATE/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change: skipping build, lint and tests."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: check (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      # Note: On Windows runners, git defaults to core.autocrlf=true, which converts repository
      # LF line endings to CRLF on checkout. This breaks `cargo fmt --check` and shell scripts.
      # We explicitly disable autocrlf before checkout so that files retain LF line endings.
      - name: Configure Git line endings
        run: git config --global core.autocrlf false

      # actions/checkout v7.0.1; full commit SHA pinned as in ounce-core.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Guardrails (unregistered binaries, key/decryption code)
        run: |
          scripts/guardrails.sh --self-test
          scripts/guardrails.sh

      # Offline tests for the repository automation scripts (triage, claim, welcome). gh is faked.
      - name: Automation script tests
        run: |
          PYTHON=$(command -v python3 || command -v python)
          "$PYTHON" -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Action pin check
        run: |
          PYTHON=$(command -v python3 || command -v python)
          "$PYTHON" scripts/check_action_pins.py

      - name: Toolchain
        if: needs.changes.outputs.code == 'true'
        run: |
          rustup show active-toolchain || rustup toolchain install stable --profile minimal -c rustfmt -c clippy
          rustc --version

      - name: fmt
        if: needs.changes.outputs.code == 'true'
        run: cargo fmt --all -- --check

      - name: clippy
        if: needs.changes.outputs.code == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        if: needs.changes.outputs.code == 'true'
        run: cargo test --workspace --locked

  artifact-roundtrip:
    name: release artifact compatibility (upload v4 / download v8)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # This synthetic check exercises the proposed release download action without
      # creating a tag, publishing a release, or building/distributing a binary.
      - name: Create synthetic release artifact
        shell: bash
        run: |
          mkdir -p artifact-input
          printf 'ounce-hb artifact compatibility\n' > artifact-input/roundtrip.txt
          (cd artifact-input && sha256sum roundtrip.txt > roundtrip.txt.sha256)

      - name: Upload synthetic release artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-artifact-compatibility
          path: artifact-input/*
          if-no-files-found: error
          retention-days: 1

      - name: Download synthetic release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Verify artifact contents and checksum
        shell: bash
        run: |
          (cd dist && sha256sum --check roundtrip.txt.sha256)
          printf 'ounce-hb artifact compatibility\n' | cmp - dist/roundtrip.txt
